[platformio]
default_envs = pocket_watch

[env:pocket_watch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Waveshare ESP32-S3-Touch-AMOLED-1.75C: ESP32-S3R8, 32 MB flash,
; 8 MB octal PSRAM.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

; The exact Waveshare-bundled GFX Library for Arduino 1.6.4 is included under
; lib/ so the build does not depend on a changing registry download.
